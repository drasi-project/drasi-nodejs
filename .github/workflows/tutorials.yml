# Validate the runnable tutorials: generated READMEs are up to date and each
# tutorial app installs and passes a lightweight smoke test. A full end-to-end
# run (Postgres + OCI plugin download) is intentionally out of scope for CI.
name: Tutorials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tutorials/**"
      - "scripts/render-tutorials.py"
      - ".github/workflows/tutorials.yml"
  pull_request:
    branches: [main]
    paths:
      - "tutorials/**"
      - "scripts/render-tutorials.py"
      - ".github/workflows/tutorials.yml"

jobs:
  render-check:
    name: Generated READMEs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tutorial READMEs match _index.md
        run: python3 scripts/render-tutorials.py --check

  building-comfort:
    name: Building Comfort — smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorials/building-comfort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Syntax-check all modules
        run: node --check src/index.mjs && for f in src/*.mjs queries.mjs; do node --check "$f"; done
      - name: SSE stream contract is consistent
        run: |
          node --input-type=module -e "
            import assert from 'node:assert';
            import { STREAMS, buildSseRoutes, reshapeRow } from './src/streams.mjs';

            // Every stream generates added/updated/deleted Handlebars routes,
            // and the reshaper mirrors the templates' field contract.
            const routes = buildSseRoutes();
            for (const s of STREAMS) {
              const r = routes[s.query];
              assert.ok(r && r.added && r.updated && r.deleted, s.query + ' has all change routes');
              assert.equal(r.added.path, '/' + s.path);
              assert.ok(r.added.template.includes('\"op\":\"add\"'));
              assert.ok(r.deleted.template.includes('before.'), 'delete reads before');
              // Templates reference each contract column via the json helper.
              for (const col of Object.values(s.fields)) {
                assert.ok(r.added.template.includes('after.' + col), 'template shapes ' + col);
              }
            }

            // reshapeRow maps raw PascalCase columns to the output contract.
            const rooms = STREAMS.find((s) => s.path === 'rooms');
            const shaped = reshapeRow(rooms.fields, { RoomId: 'r1', RoomName: 'Room 01', ComfortLevel: 46 });
            assert.equal(shaped.id, 'r1');
            assert.equal(shaped.name, 'Room 01');
            assert.equal(shaped.comfort, 46);
            console.log('✅ SSE stream contract ok');
          "

  curbside-pickup:
    name: Curbside Pickup — smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorials/curbside-pickup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Syntax-check all modules
        run: node --check src/index.mjs && for f in src/*.mjs queries.mjs; do node --check "$f"; done
      - name: SSE stream contract is consistent
        run: |
          node --input-type=module -e "
            import assert from 'node:assert';
            import { STREAMS, buildSseRoutes, reshapeRow } from './src/streams.mjs';

            // Every stream generates added/updated/deleted Handlebars routes,
            // and the reshaper mirrors the templates' field contract.
            const routes = buildSseRoutes();
            for (const s of STREAMS) {
              const r = routes[s.query];
              assert.ok(r && r.added && r.updated && r.deleted, s.query + ' has all change routes');
              assert.equal(r.added.path, '/' + s.path);
              assert.ok(r.added.template.includes('\"op\":\"add\"'));
              assert.ok(r.deleted.template.includes('before.'), 'delete reads before');
              // Templates reference each contract column via the json helper.
              for (const col of Object.values(s.fields)) {
                assert.ok(r.added.template.includes('after.' + col), 'template shapes ' + col);
              }
            }

            // The delay stream's merge key is derived from orderId (the query has
            // no 'id' column), so the reshaper maps both from the same source.
            const delay = STREAMS.find((s) => s.path === 'delay');
            const shaped = reshapeRow(delay.fields, { orderId: 7, customerName: 'Ava', waitingSinceTimestamp: '2025-01-01T00:00:00Z' });
            assert.equal(shaped.id, 7);
            assert.equal(shaped.orderId, 7);
            assert.equal(shaped.customerName, 'Ava');
            assert.equal(shaped.waitingSince, '2025-01-01T00:00:00Z');
            console.log('✅ SSE stream contract ok');
          "

  getting-started:
    name: Getting Started — smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorials/getting-started
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Syntax-check all modules
        run: node --check src/index.mjs && for f in src/*.mjs queries.mjs; do node --check "$f"; done
      - name: Continuous-query topology is consistent
        run: |
          node --input-type=module -e "
            import assert from 'node:assert';
            import { QUERIES, QUERY_IDS, SOURCE_MESSAGES, SOURCE_LOCATIONS } from './queries.mjs';

            // Five queries with the expected ids.
            assert.deepEqual(QUERY_IDS, [
              'all-messages', 'hello-world-senders', 'message-counts',
              'inactive-senders', 'messages-with-location',
            ]);
            for (const q of QUERIES) {
              assert.ok(q.id && q.query && Array.isArray(q.sources) && Array.isArray(q.joins), q.id + ' well-formed');
              assert.ok(q.sources.includes(SOURCE_MESSAGES), q.id + ' reads the messages source');
            }

            // Only the join query uses the second source + the FROM_USER join.
            const join = QUERIES.find((q) => q.id === 'messages-with-location');
            assert.deepEqual(join.sources, [SOURCE_MESSAGES, SOURCE_LOCATIONS]);
            assert.equal(join.joins.length, 1);
            assert.equal(join.joins[0].id, 'FROM_USER');
            assert.ok(join.query.includes('FROM_USER'), 'join query traverses FROM_USER');

            // The time-based query uses drasi.trueLater; the aggregation uses count().
            assert.ok(QUERIES.find((q) => q.id === 'inactive-senders').query.includes('drasi.trueLater'));
            assert.ok(/count\(/.test(QUERIES.find((q) => q.id === 'message-counts').query));
            console.log('✅ continuous-query topology ok');
          "
      - name: locations.jsonl bootstrap file is valid
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import assert from 'node:assert';
            const lines = readFileSync('locations.jsonl', 'utf8').trim().split('\n').map((l) => JSON.parse(l));
            assert.equal(lines[0].kind, 'Header', 'first record is a Header');
            const nodes = lines.filter((l) => l.kind === 'Node');
            assert.ok(nodes.length >= 1, 'has UserLocation nodes');
            assert.ok(nodes.every((n) => n.labels.includes('UserLocation') && n.properties.name), 'nodes are labelled UserLocation with a name');
            console.log('✅ locations.jsonl ok (' + nodes.length + ' nodes)');
          "
